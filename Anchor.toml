[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.22"

[features]
resolution = true
skip-lint = false

[programs.devnet]
p2p_escrow      = "ESCRw1111111111111111111111111111111111111111"
mint_governance = "MINTg1111111111111111111111111111111111111111"
amm_swap        = "AMMSw1111111111111111111111111111111111111111"
treasury_rbs    = "TRBSr1111111111111111111111111111111111111111"
swift_bridge    = "SWBRd1111111111111111111111111111111111111111"

[programs.mainnet]
p2p_escrow      = "ESCRm1111111111111111111111111111111111111111"
mint_governance = "MINTm1111111111111111111111111111111111111111"
amm_swap        = "AMMSm1111111111111111111111111111111111111111"
treasury_rbs    = "TRBSm1111111111111111111111111111111111111111"
swift_bridge    = "SWBRm1111111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet   = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = [
  "programs/p2p-escrow",
  "programs/mint-governance",
  "programs/amm-swap",
  "programs/treasury-rbs",
  "programs/swift-bridge/solana",
]
