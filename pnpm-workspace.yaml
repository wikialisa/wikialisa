packages:
  # ── Front-end applications (Next.js, Vite, Node services) ──────────────────
  - 'apps/*'

  # ── Shared libraries, SDKs, contracts, UI kit ──────────────────────────────
  - 'packages/*'

  # ── Back-end micro-services ────────────────────────────────────────────────
  - 'services/*'

  # ── Anchor/Solana + EVM on-chain programs (Rust/Solidity, no package.json)
  # Khai báo để Turborepo nhận diện workspace; pnpm bỏ qua nếu không có package.json
  # - 'programs/*'           ← Uncomment khi thêm package.json cho Anchor programs

  # ── Loại trừ node_modules ở mọi cấp độ ────────────────────────────────────
  - '!**/node_modules/**'
  - '!**/dist/**'
  - '!**/.next/**'

# ── pnpm Catalogs: Tập trung hóa phiên bản các dependency dùng chung ─────────
# Các package trong workspace tham chiếu bằng: "catalog:"
catalog:
  # ── Runtime phổ biến ────────────────────────────────────────────────────────
  react:                 "^18.3.1"
  react-dom:             "^18.3.1"
  next:                  "^14.2.0"
  zod:                   "^3.24.1"
  axios:                 "^1.7.9"
  viem:                  "^2.21.53"
  ethers:                "^6.13.4"
  ioredis:               "^5.4.1"
  fast-xml-parser:       "^4.5.0"
  uuid:                  "^11.0.3"
  js-yaml:               "^4.1.0"

  # ── Blockchain ──────────────────────────────────────────────────────────────
  "@coral-xyz/anchor":   "^0.30.1"
  "@solana/web3.js":     "^1.98.0"
  "@openzeppelin/contracts": "^5.2.0"

  # ── Dev tools (dùng chung ở workspace level) ─────────────────────────────────
  typescript:            "^5.7.2"
  tsup:                  "^8.3.5"
  vitest:                "^2.1.8"
  "@types/node":         "^22.10.0"
