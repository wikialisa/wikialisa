# =====================================================================
# WIKIALISA CORE ZERO-TRUST CAPABILITY & ROLE ASSIGNMENT POLICY
# =====================================================================
# Quy định giới hạn quyền hạn nghiêm ngặt theo nguyên tắc đặc quyền tối thiểu:
# - Cấm superuser Root toàn năng
# - Phân tách biệt lập giữa mạng P2P, đào PoK, và ví tiền mật mã
# =====================================================================

[role.kernel_sentinel]
description = "Kernel Security Auditor and Integrity Checker"
capabilities = CAP_SYS_PTRACE, CAP_DAC_READ_SEARCH
allowed_devices = /dev/kmsg, /dev/mem
restricted_network = true
log_audit_events = true

[role.consensus_governor]
description = "Proof-of-Kernel Miner and Entropy Governor"
capabilities = CAP_SYS_NICE, CAP_IPC_LOCK
allowed_devices = /dev/axq, /dev/urandom
allowed_ports = 8333
restricted_disk_raw = true

[role.network_warden]
description = "Network Warden and Zero-Trust Firewall Operator"
capabilities = CAP_NET_ADMIN, CAP_NET_BIND_SERVICE, CAP_NET_RAW
allowed_devices = /dev/net/tun
allowed_ports = 22, 8333
restricted_filesystem = true

[role.wallet_manager]
description = "Hardware Enclave Wallet Execution Sandboxing"
capabilities = CAP_IPC_LOCK
allowed_devices = /dev/null
memory_mlock_required = true
restricted_network = true
restricted_disk_raw = true
