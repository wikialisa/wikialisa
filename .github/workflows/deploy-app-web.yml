name: Deploy app-web — app.axvn.vn

on:
  push:
    branches: [main]
    paths:
      - "apps/app-web/**"
      - "packages/**"
      - ".github/workflows/deploy-app-web.yml"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild kể cả khi không có thay đổi"
        type: boolean
        default: false

concurrency:
  group: deploy-app-web
  cancel-in-progress: false   # không cancel deploy đang chạy

env:
  NODE_VERSION: "22.14.0"
  PNPM_VERSION: "9.15.9"
  APP_NAME: app-web

jobs:
  # ── 1. Build app-web standalone ───────────────────────────────────────────
  build:
    name: Build app-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Cache pnpm store để tăng tốc install
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # Cache turbo build
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-app-web-${{ github.sha }}
          restore-keys: turbo-app-web-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages + app-web
        run: pnpm turbo run build --filter=@wikialisa/app-web...
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: ${{ vars.PROD_API_URL || 'https://api.axvn.vn/api/v1' }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.PROD_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
          NEXT_PUBLIC_WS_URL: ${{ vars.PROD_WS_URL || 'wss://api.axvn.vn' }}
          NEXT_PUBLIC_CHAIN_ID: ${{ vars.PROD_CHAIN_ID || '1' }}

      - name: Verify build output
        run: |
          echo "=== .next/standalone ==="
          ls apps/app-web/.next/standalone/ | head -10
          echo "=== server.js ==="
          ls apps/app-web/.next/standalone/apps/app-web/server.js

      - name: Package standalone artifact
        run: |
          # Tạo thư mục deploy-ready: standalone + static + public
          mkdir -p /tmp/app-web-deploy/apps/app-web
          cp -r apps/app-web/.next/standalone/. /tmp/app-web-deploy/
          cp -r apps/app-web/.next/static  /tmp/app-web-deploy/apps/app-web/.next/
          [ -d apps/app-web/public ] && cp -r apps/app-web/public /tmp/app-web-deploy/apps/app-web/
          # Tạo start script
          cat > /tmp/app-web-deploy/start.sh << 'EOF'
          #!/usr/bin/env bash
          PORT=${PORT:-3010} HOSTNAME=0.0.0.0 node apps/app-web/server.js
          EOF
          chmod +x /tmp/app-web-deploy/start.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-web-standalone-${{ github.sha }}
          path: /tmp/app-web-deploy/
          retention-days: 3

  # ── 2. Deploy lên production server (app.axvn.vn) ─────────────────────────
  deploy:
    name: Deploy → app.axvn.vn
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.axvn.vn
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-web-standalone-${{ github.sha }}
          path: ./app-web-deploy

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/var/www/wikialisa/app-web"
            BACKUP_DIR="/var/www/wikialisa/app-web.backup.$(date +%Y%m%d%H%M%S)"

            echo "📦 Backup current deploy..."
            [ -d "$DEPLOY_DIR" ] && cp -r "$DEPLOY_DIR" "$BACKUP_DIR" || true

            echo "🚀 Deploying new build..."
            mkdir -p "$DEPLOY_DIR"
            # Artifact đã được scp bởi appleboy/ssh-action script upload step

            echo "🔄 Reload PM2..."
            cd "$DEPLOY_DIR"
            pm2 reload app-web --update-env 2>/dev/null || \
              pm2 start apps/app-web/server.js --name app-web \
                --env production \
                -- --port 3010 \
                2>/dev/null

            pm2 save

            echo "✅ Deploy complete — app.axvn.vn"
            pm2 ls | grep app-web

      - name: Health check
        run: |
          echo "⏳ Waiting 15s for server to start..."
          sleep 15
          curl -fsSL --max-time 10 https://app.axvn.vn/api/health \
            && echo "✅ app.axvn.vn health OK" \
            || echo "⚠️  Health check failed — server may still be starting"

      - name: Notify
        if: success()
        run: |
          echo "✅ app-web deployed: commit ${{ github.sha }}"
          echo "🌐 URL: https://app.axvn.vn"
